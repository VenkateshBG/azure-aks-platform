name: Build and deploy

# push to main  -> build image, push to ACR, deploy to dev
# manual run    -> choose dev or prod (prod can require reviewer approval via the `prod` Environment)
on:
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", "scripts/deploy.sh", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'dev' }}
  cancel-in-progress: false

env:
  RG: rg-aksplat-dev
  AKS: aks-aksplat-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC - no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find ACR
        id: acr
        run: |
          NAME=$(az acr list -g "$RG" --query '[0].name' -o tsv)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "server=$(az acr show -n "$NAME" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ steps.acr.outputs.server }}/aks-platform-api:${{ github.sha }}
            ${{ steps.acr.outputs.server }}/aks-platform-api:latest

      - name: Deploy to cluster
        run: ./scripts/deploy.sh "${{ inputs.target || 'dev' }}" "${{ github.sha }}"
