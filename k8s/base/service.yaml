apiVersion: v1
kind: Service
metadata:
  name: aks-platform-api
  labels:
    app.kubernetes.io/name: aks-platform-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aks-platform-api
  ports:
    - name: http # Prometheus ServiceMonitor scrapes this named port
      port: 80
      targetPort: http
