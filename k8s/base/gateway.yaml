# Gateway API (the successor to Ingress). Implemented by Envoy Gateway, installed via Helm
# (see k8s/platform). The `eg` GatewayClass is defined in k8s/platform/gatewayclass.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aks-platform-gw
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-platform-api
spec:
  parentRefs:
    - name: aks-platform-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aks-platform-api
          port: 80
