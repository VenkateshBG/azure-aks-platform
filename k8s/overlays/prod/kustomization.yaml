apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: aks-platform-api
    newName: ${ACR_LOGIN_SERVER}/aks-platform-api
    newTag: ${IMAGE_TAG}
replicas:
  - name: aks-platform-api
    count: 2
patches:
  - target: { kind: Deployment, name: aks-platform-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: ${IMAGE_TAG}
