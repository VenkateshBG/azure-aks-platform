apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - namespace.yaml
  - ../../base
# ${ACR_LOGIN_SERVER} and ${IMAGE_TAG} are substituted by `envsubst` in the pipeline.
images:
  - name: aks-platform-api
    newName: ${ACR_LOGIN_SERVER}/aks-platform-api
    newTag: ${IMAGE_TAG}
replicas:
  - name: aks-platform-api
    count: 1
patches:
  - target: { kind: HorizontalPodAutoscaler, name: aks-platform-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target: { kind: Deployment, name: aks-platform-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: ${IMAGE_TAG}
