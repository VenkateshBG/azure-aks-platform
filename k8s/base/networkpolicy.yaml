# Zero-trust networking (enforced by Cilium): deny all ingress, then allow only
#  - the Envoy gateway proxies (public traffic)
#  - Prometheus in the monitoring namespace (metrics scraping)
#  - other pods in the same namespace (e.g. the load-test pods)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-prometheus-and-same-ns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aks-platform-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
